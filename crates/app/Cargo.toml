[package]
name = "snapwright-app"
description = "Snapwright desktop app (GPUI): hotkey, selection overlay, clipboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "snapwright-app"
path = "src/main.rs"

[dependencies]
snapwright-capture.workspace = true
snapwright-library.workspace = true
snapwright-editor.workspace = true
snapwright-ocr.workspace = true
snapwright-record.workspace = true
anyhow.workspace = true
chrono.workspace = true
directories.workspace = true
futures.workspace = true
global-hotkey.workspace = true
gpui-kit.workspace = true
image.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon.workspace = true
# The OS trust store, so updates work behind TLS-inspecting proxies.
ureq = { workspace = true, features = ["platform-verifier"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard.workspace = true
# Matches GPUI's Wayland display UUIDs (v5 of the connector name) to capture displays.
uuid = { version = "1", features = ["v5"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win.workspace = true
raw-window-handle.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
