[package]
name = "snapwright-record"
description = "Snapwright screen recording: paced capture into MP4 (hardware H.264 where the OS has it) or GIF"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
snapwright-capture.workspace = true
thiserror.workspace = true
tracing.workspace = true
gif.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSDictionary", "NSValue", "NSURL"] }
objc2-core-foundation.workspace = true
objc2-av-foundation.workspace = true
objc2-core-video.workspace = true
objc2-core-media.workspace = true
objc2-core-audio-types.workspace = true
block2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
