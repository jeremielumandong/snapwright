[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/capture",
    "crates/cli",
    "crates/editor",
    "crates/library",
    "crates/ocr",
    "crates/record",
]

[workspace.package]
version = "0.2.7"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/jeremielumandong/snapwright"

[workspace.dependencies]
# internal
snapwright-capture = { path = "crates/capture" }
snapwright-library = { path = "crates/library" }
snapwright-editor = { path = "crates/editor" }
snapwright-ocr = { path = "crates/ocr" }
snapwright-record = { path = "crates/record" }

# common
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }
png = "0.18"
futures = "0.3"
directories = "6"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# library
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1.8"

# OCR on Linux: ocrs (pure Rust, MIT/Apache) with its models fetched once into the data folder
ocrs = { version = "0.13", default-features = false, features = ["rten"] }
rten = { version = "0.26", default-features = false, features = ["rten_format"] }
rten-imageproc = "0.26"
ureq = "3"
# in-app updates: SHA-256 of the downloaded release asset
sha2 = "0.10"

# editor: the same rasteriser as Emulsion, and a small font loader for annotation text
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"

# recording: GIF encoding everywhere; MP4 goes through the OS encoder (or ffmpeg on Linux)
gif = "0.14"
# recording sound on macOS and Windows: Core Audio (with loopback through a process tap) and
# WASAPI (loopback on the output device). Linux reads PulseAudio through ffmpeg.
cpal = { version = "0.18.2", default-features = false }

# UI: gpui-kit is the facade over gpui (gpui-pre =0.3.9) + gpui-component 0.7.3, kept in
# lockstep, as in Switchyard. `image` must match the version gpui links (its `Frame` type).
gpui-kit = "=0.7.3"
image = { version = "0.25", default-features = false }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
global-hotkey = "0.8"
# Linux clipboard images: GPUI's X11 clipboard writes text only. On Wayland arboard uses the
# data-control protocol (wlroots compositors, KDE).
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
# Windows clipboard images as a bitmap too: GPUI writes the registered "PNG" format only.
clipboard-win = "5.4"

# Linux
x11rb = { version = "0.14", features = ["randr", "shm", "xfixes"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libc = "0.2"

# Windows
windows = "0.62"
windows-future = "0.3"
raw-window-handle = "0.6"

# macOS
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSString"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGDataProvider", "CGDirectDisplay", "objc2"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "libc", "objc2-core-foundation", "objc2-core-graphics", "SCShareableContent", "SCStream", "SCScreenshotManager"] }
block2 = "0.6"
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-media", "objc2-core-video", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "AVAnimation"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime", "CMSampleBuffer", "CMBlockBuffer", "CMFormatDescription", "CMBase", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# gpui-fast (Retained Mode rendering) in place of GPUI Kit's upstream `gpui-pre`, pinned to
# the same revision Switchyard ships. See docs/DECISIONS.md.
[patch.crates-io]
gpui-pre = { git = "https://github.com/longbridge/gpui-fast", rev = "124f79b0f14c688ae87877e370c015a9dc9d7ce5" }
gpui-pre-platform = { git = "https://github.com/longbridge/gpui-fast", rev = "124f79b0f14c688ae87877e370c015a9dc9d7ce5" }
gpui-pre-macros = { git = "https://github.com/longbridge/gpui-fast", rev = "124f79b0f14c688ae87877e370c015a9dc9d7ce5" }
gpui-pre-sum-tree = { git = "https://github.com/longbridge/gpui-fast", rev = "124f79b0f14c688ae87877e370c015a9dc9d7ce5" }
gpui-pre-web = { git = "https://github.com/longbridge/gpui-fast", rev = "124f79b0f14c688ae87877e370c015a9dc9d7ce5" }
